<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金甌女中｜轉學生報名管理後台</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --primary: #234f9d;
      --primary-dark: #1a3d80;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dfe7f5;
      --shadow: 0 10px 24px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 24px;
    }

    .header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 28px 32px;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      color: var(--primary-dark);
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .form-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px 28px;
    }

    .section {
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid #edf1f7;
    }

    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .section-title {
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 18px;
      font-size: 1.2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 18px 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 0.98rem;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(35, 79, 157, 0.12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 22px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn-reset {
      background: #eef2f7;
      color: var(--text);
    }

    .btn-submit {
      background: var(--primary);
      color: #fff;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
    }

    .result-box {
      margin-top: 24px;
      background: #f8fbff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: none;
    }

    .result-box.active {
      display: block;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, monospace;
      font-size: 0.9rem;
      color: #1f2937;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 16px;
      }

      .header, .form-card {
        padding: 20px 18px;
      }

      .actions {
        flex-direction: column-reverse;
      }

      button {
        width: 100%;
      }
    }
  </style>

<style>
:root{color-scheme:light; --ink:#20322c; --gold:#eab72d}
body{background:#f3f5f0;color:var(--ink)}
.container{max-width:1080px}
.header,.form-card{border:1px solid #dfe6dd;box-shadow:0 5px 22px #20322c09}
.header{border-top:5px solid var(--gold)}
.brand{display:block;width:min(100%,330px);height:auto;margin-bottom:18px}
.header h1{color:var(--ink);margin-bottom:8px}
.notice{background:#fcf5df;border-left:4px solid var(--gold);padding:9px 12px;margin-top:14px;font-size:14px}
nav,.tools{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;align-items:end}
button{background:#e7eee7;color:#22352b;border:1px solid #d0dbd1;padding:8px 14px;border-radius:8px;cursor:pointer}
nav [aria-pressed=true],.btn-submit,.btn-submit:hover{background:#244d3b;color:white}
.section-title{color:var(--ink)}
canvas{display:block;width:100%;max-width:460px;border:1px dashed #89998c;background:#fff;border-radius:8px;touch-action:none;margin-bottom:8px}
.thumb{display:block;max-width:185px;max-height:140px;margin-top:8px;object-fit:contain}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;text-align:left}
td,th{padding:10px;border-bottom:1px solid #dfe6dd;vertical-align:top}
td button{margin:2px;font-size:13px}
th{background:#eef2ec}
#formMessage{color:#992f2e}
[hidden]{display:none!important}
@media(max-width:600px){nav button,.tools button,td button{width:auto}}
@page{size:A4;margin:15mm}
@media print{body{background:white;color:black}.container{display:none!important}#printSheet[hidden]{display:block!important}#printSheet h1{font-size:22px}.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.print-grid p{margin:6px 0;overflow-wrap:anywhere}.brand{width:72mm}td{border:1px solid black}table{break-inside:avoid}}
</style>
<style id="pageFormat">@page{size:A4 portrait;margin:12mm}</style>
<style>
@media print{
#printSheet h2{font-size:16px;margin:10px 0 5px}
.print-note{margin:0 0 6px;font-size:11px}
.two-part .print-grid{margin:4px 0;gap:0 12px}
.two-part dl div{display:grid;grid-template-columns:7em 1fr;border-bottom:1px solid #ddd;padding:4px 0;font-size:12px}
.two-part dl dd{margin:0;overflow-wrap:anywhere}
.print-attachments{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:7px;font-size:12px}
.print-attachments .thumb{max-height:22mm;max-width:48mm;object-position:left}
.cut-line{border-top:1px dashed #555;text-align:center;padding-top:4px;margin:12px 0 6px;font-size:11px}
.receipt{break-inside:avoid;font-size:13px}
.receipt p{margin:7px 0}
.interview table{table-layout:fixed;break-inside:auto;font-size:9px}
.interview tr{break-inside:avoid}
.interview td,.interview th{border:1px solid #555;padding:4px;overflow-wrap:anywhere}
.interview td{height:9mm}
.interview th:first-child{width:9%}.interview th:last-child{width:13%}
}
</style></head>

    <form id="applicationForm" class="form-card" hidden>
      <div class="section">
        <div class="section-title">基本資料</div>

        <div class="form-grid">
          <div class="field">
            <label for="sno">報名編號</label>
            <input id="sno" name="sno" type="text" readonly />
          </div>

          <div class="field">
            <label for="registerDate">登錄日期</label>
            <input id="registerDate" name="registerDate" type="date" readonly />
          </div>

          <div class="field">
            <label for="department">報考科別</label>
            <select id="department" name="department" required>
              <option value="">請選擇科系</option>
              <option value="101">普通科（101）</option>
              <option value="401">商業經營科（401）</option>
              <option value="407">觀光事業科（407）</option>
              <option value="430">多媒體設計科（430）</option>
              <option value="433">應用英語科（433）</option>
              <option value="434">應用日語科（434）</option>
            </select>
          </div>

          <div class="field">
            <label for="applicationGrade">報考年級</label>
            <select id="applicationGrade" name="applicationGrade" required>
              <option value="">請選擇年級</option>
              <option value="高一">高一</option>
              <option value="高二">高二</option>
            </select>
          </div>
          <div class="field">
            <label for="studentName">姓名</label>
            <input id="studentName" name="studentName" type="text" placeholder="請輸入姓名" required />
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">原學校資料</div>

        <div class="form-grid">
          <div class="field">
            <label for="originalSchoolName">原學校名稱</label>
            <input id="originalSchoolName" name="originalSchoolName" type="text" placeholder="請輸入原就讀學校名稱" required />
          </div>

          <div class="field">
            <label for="originalDepartment">原學校科組</label>
            <input id="originalDepartment" name="originalDepartment" type="text" placeholder="例如：資訊科、會計科、設計科" required />
          </div>

          <div class="field">
            <label for="originalStudentId">原學校學號</label>
            <input id="originalStudentId" name="originalStudentId" type="text" placeholder="請輸入原學校學號" />
          </div>

          <div class="field">
            <label for="originalSemester">原學校學期</label>
            <input id="originalSemester" name="originalSemester" type="text" placeholder="例如：第 3 學期 / 109-2" />
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">聯絡資訊</div>

        <div class="form-grid">
          <div class="field">
            <label for="studentPhone">學生手機</label>
            <input id="studentPhone" name="studentPhone" type="tel" placeholder="例如：0912-345-678" required />
          </div>

          <div class="field">
            <label for="studentEmail">學生信箱</label>
            <input id="studentEmail" name="studentEmail" type="email" placeholder="例如：student@example.com" required />
          </div>

          <div class="field">
            <label for="householdZip">戶籍區號</label>
            <input id="householdZip" name="householdZip" type="text" placeholder="例如：100" />
          </div>

          <div class="field">
            <label for="phone">電話</label>
            <input id="phone" name="phone" type="tel" placeholder="例如：04-12345678" />
          </div>

          <div class="field full">
            <label for="householdAddress">戶籍地址</label>
            <input id="householdAddress" name="householdAddress" type="text" placeholder="請輸入完整戶籍地址" required />
          </div>

          <div class="field">
            <label for="mailZip">郵遞區號</label>
            <input id="mailZip" name="mailZip" type="text" placeholder="例如：300" />
          </div>

          <div class="field full">
            <label for="mailAddress">通訊地址</label>
            <input id="mailAddress" name="mailAddress" type="text" placeholder="請輸入通訊地址" required />
          </div>

          <div class="field">
            <label for="contactPerson">連絡人</label>
            <input id="contactPerson" name="contactPerson" type="text" placeholder="請輸入連絡人姓名" />
          </div>

          <div class="field">
            <label for="contactPhone">連絡電話</label>
            <input id="contactPhone" name="contactPhone" type="tel" placeholder="請輸入連絡電話" />
          </div>
        </div>
      </div>

<section class="section">
  <h2 class="section-title">報名人簽名與相片</h2>
  <div class="form-grid"><div class="field"><label for="signature">報名人簽名</label><canvas id="signature" width="720" height="270" aria-label="使用滑鼠或手指簽名"></canvas><button id="clear" type="button">清除簽名</button></div>
  <div class="field"><label for="photo">上傳報名相片</label><input id="photo" type="file" accept="image/jpeg,image/png"><small>JPG 或 PNG，最大 3 MB</small><img id="photoPreview" class="thumb" hidden alt="報名相片預覽"></div></div>
</section>
<p id="formMessage" role="status"></p>
<div class="actions"><button type="button" id="back">返回名單</button><button type="submit" class="btn-submit" id="submit">儲存修改</button></div>
</form>

<div class="tools"><label>查詢<input id="query" placeholder="姓名、編號、報考科別、年級"></label><button id="rubric" type="button">列印本次查詢的面試評分表</button></div>
<div class="table-wrap"><table><thead><tr><th>報名編號</th><th>姓名</th><th>報考科別</th><th>報考年級</th><th>登錄日期</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<p><small>正式版 Excel 匯出預計涵蓋原表全部欄位、報名編號及繳費狀態。校內作業另可對應應繳資料、到考、筆試成績、錄取意見及註記。照片與簽名由管理後台開啟。</small></p>
</section>
</div><article id="printSheet" hidden></article>
<script>
const byId = id => document.getElementById(id);
const form = byId('applicationForm');
const canvas = byId('signature');
const ctx = canvas.getContext('2d');
ctx.lineWidth = 4;
ctx.lineCap = 'round';
ctx.strokeStyle = '#20322c';
let previousSignature = '', signed = false, pointer = null, photo = '', photoPending = false, editing = null;
async function request(path, method = 'GET', data = {}) {
  const options = {method};
  if (method !== 'GET') {
    options.headers = {'Content-Type':'application/json'};
    options.body = JSON.stringify(data);
  }
  const response = await fetch(path, options);
  const body = await response.json();
  if (!response.ok) {
    const error = new Error(body.error || '連線失敗。');
    error.status = response.status;
    throw error;
  }
  return body;
}
let records = [];
async function refreshRecords() {
  try {
    const result = await request('/api/admin/records');
    records = result.records;
    byId('adminMessage').textContent = '';
    render();
  } catch (error) {
    if (error.status === 401) location.replace('/admin');
    else byId('adminMessage').textContent = error.message;
  }
}
byId('logout').onclick = async () => {
  try {
    await request('/api/admin/logout', 'POST');
    location.replace('/admin');
  } catch (error) {
    byId('adminMessage').textContent = error.message;
  }
};
function resetForm(record = {}) {
  form.reset();
  for (const field of form.elements) {
    if (field.name && field.type !== 'file') field.value = record[field.name] ?? field.value;
  }
  byId('sno').value = record.sno || '';
  byId('registerDate').value = record.registerDate || '';
  byId('clear').click();
  if (record.signature) {
    previousSignature = record.signature;
    const img = new Image();
    img.onload = () => {if (editing === record && previousSignature === record.signature) ctx.drawImage(img,0,0);};
    signed = true;
    img.src = record.signature;
  }
  showPhoto(record.photo || '');
  byId('formMessage').textContent = '';
}
function showPhoto(src) {
  photo = src;
  const img = byId('photoPreview');
  img.hidden = !src;
  if (src) img.src = src; else img.removeAttribute('src');
}
function point(event) {
  const rect = canvas.getBoundingClientRect();
  return [(event.clientX - rect.left) * canvas.width / rect.width,(event.clientY - rect.top) * canvas.height / rect.height];
}
canvas.addEventListener('pointerdown', e => {
  if (pointer !== null || e.button !== 0) return;
  pointer = e.pointerId;
  canvas.setPointerCapture(pointer);
  ctx.beginPath();
  ctx.moveTo(...point(e));
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== pointer) return;
  ctx.lineTo(...point(e));
  ctx.stroke();
  previousSignature = '';
  signed = true;
});
for (const event of ['pointerup','pointercancel','lostpointercapture']) {
  canvas.addEventListener(event,e => {if (e.pointerId === pointer) pointer = null;});
}
byId('clear').onclick = () => {ctx.clearRect(0,0,canvas.width,canvas.height); signed = false; previousSignature = '';};
byId('photo').onchange = async e => {
  const input = e.target;
  const file = input.files[0];
  byId('formMessage').textContent = '';
  showPhoto('');
  if (!file) return;
  if (!['image/jpeg','image/png'].includes(file.type) || file.size > 3 * 1024 * 1024) {
    input.value = '';
    byId('formMessage').textContent = '請選擇 3 MB 以內的 JPG 或 PNG 相片。';
    return;
  }
  photoPending = true;
  const reader = new FileReader();
  reader.onload = () => {if (input.files[0] === file) showPhoto(reader.result);};
  reader.onerror = () => {byId('formMessage').textContent = '相片讀取失敗，請重新選擇。';};
  reader.onloadend = () => {photoPending = false;};
  reader.readAsDataURL(file);
};
function mode(admin) {
  form.hidden = admin;
  byId('admin').hidden = !admin;
  if (admin) render();
}
byId('back').onclick = () => {editing = null; mode(true);};
const dept = value => [...form.elements.department.options].find(x => x.value === value)?.textContent || '';
form.onsubmit = async e => {
  e.preventDefault();
  if (photoPending) return;
  const data = Object.fromEntries(new FormData(form));
  data.sno = editing.sno;
  data.photo = photo;
  data.signature = previousSignature || (signed ? canvas.toDataURL() : '');
  const submit = byId('submit');
  submit.disabled = true;
  try {
    const result = await request('/api/admin/records/' + editing.sno, 'PUT', data);
    records = records.map(record => record.sno === data.sno ? result.record : record);
    editing = null;
    mode(true);
  } catch (error) {
    if (error.status === 401) location.replace('/admin');
    else byId('formMessage').textContent = error.message;
  } finally {
    submit.disabled = false;
  }
};
async function deleteRecord(record) {
  if (!confirm('刪除這筆報名紀錄？')) return;
  try {
    await request('/api/admin/records/' + record.sno, 'DELETE');
    await refreshRecords();
  } catch (error) {
    if (error.status === 401) location.replace('/admin');
    else byId('adminMessage').textContent = error.message;
  }
}
function element(tag, label, parent) {
  const node = document.createElement(tag);
  node.textContent = label;
  parent.append(node);
  return node;
}
function filteredRecords() {
  const key = byId('query').value.trim().toLowerCase();
  return records.filter(r => [r.sno,r.studentName,dept(r.department),r.applicationGrade || ''].some(value => value.toLowerCase().includes(key)));
}
function render() {
  const tbody = byId('rows');
  tbody.replaceChildren();
  const results = filteredRecords();
  byId('rubric').disabled = results.length === 0;
  for (const data of results) {
    const row = element('tr','',tbody);
    [data.sno,data.studentName,dept(data.department),data.applicationGrade,data.registerDate].forEach(v => element('td',v,row));
    const actions = element('td','',row);
    const buttons = [
      ['檢視／修改', () => {editing = data; mode(false); resetForm(data);}],
      ['列印報名表', () => printPage('application',data)],
      ['列印評分表', () => printPage('rubric',[data])],
      ['刪除', () => deleteRecord(data)]
    ];
    for (const [label, action] of buttons) element('button',label,actions).onclick = action;
  }
  if (!tbody.children.length) element('td','查無報名資料',element('tr','',tbody)).colSpan = 6;
}
function printPage(kind, data = {}) {
  const sheet = byId('printSheet');
  sheet.replaceChildren();
  const logo = byId('brand').cloneNode(true);
  logo.removeAttribute('id');
  sheet.append(logo);
  const twoPart = kind !== 'rubric';
  const pageRule = byId('pageFormat').sheet.cssRules[0];
  pageRule.style.setProperty('size', twoPart ? 'A4 portrait' : 'A4 landscape');
  sheet.className = twoPart ? 'two-part' : 'interview';
  element('h1',twoPart ? '轉學生報名表暨報名費收據' : '轉學考試務／面試評分表',sheet);
  element('p','',sheet).className = 'print-note';

  if (twoPart) {
    element('h2','上聯｜考生報名資料（學校留存）',sheet);
    const info = element('dl','',sheet);
    info.className = 'print-grid';
    for (const label of form.querySelectorAll('label[for]')) {
      const key = label.htmlFor;
      if (!(key in data) || ['photo','signature'].includes(key)) continue;
      const field = element('div','',info);
      element('dt',label.textContent,field);
      element('dd',(key === 'department' ? dept(data[key]) : data[key]) || '—',field);
    }
    const attachments = element('div','',sheet);
    attachments.className = 'print-attachments';
    for (const [key,label] of [['photo','報名相片'],['signature','報名人簽名']]) {
      const item = element('div','',attachments);
      element('strong',label,item);
      if (data[key]) {
        const img = element('img','',item);
        img.className = 'thumb';
        img.alt = label;
        img.src = data[key];
      } else element('p','—',item);
    }
    element('p','沿虛線撕下',sheet).className = 'cut-line';
    const receipt = element('section','',sheet);
    receipt.className = 'receipt';
    element('h2','下聯｜報名費收據（考生留存）',receipt);
    element('p','報名編號　'+data.sno+'　　考生姓名　'+data.studentName,receipt);
    element('p','報考科別　'+dept(data.department)+'　　報考年級　'+data.applicationGrade,receipt);
    element('p','實收金額　新臺幣 __________ 元　　收款日期　____ 年 ____ 月 ____ 日',receipt);
    element('p','經手人　____________　　收款章　____________',receipt);
    element('p','請於報到時出示本表。下聯由校方收款並核章後交考生留存。',receipt);
  } else {
    const table = element('table','',sheet);
    const head = element('tr','',element('thead','',table));
    ['報名編號','考生姓名','報到／簽名','報名費','應繳資料','原學校名稱','原學校科組','報考科別','報考年級','輔導班','學生手機','面試序號','筆試成績','錄取意見','註記'].forEach(label => element('th',label,head));
    const body = element('tbody','',table);
    for (const record of data) {
      const row = element('tr','',body);
      [record.sno,record.studentName,'','','',record.originalSchoolName,record.originalDepartment,dept(record.department),record.applicationGrade,'',record.studentPhone,'','','',''].forEach(value => element('td',value || '',row));
    }
  }
  const images = [...sheet.querySelectorAll('img')];
  Promise.allSettled(images.map(img => img.decode())).then(() => window.print());
}
byId('rubric').onclick = () => {const results = filteredRecords(); if (results.length) printPage('rubric',results);};
byId('query').oninput = render;
byId('refresh').onclick = refreshRecords;
refreshRecords();
</script></body></html>
